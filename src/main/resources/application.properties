# PostgreSQL Veritabanı Bağlantı Ayarları
# 'hastane_db' yerine kendi oluşturduğunuz veritabanı adını yazın.
spring.datasource.url=jdbc:postgresql://localhost:5432/hastane_db
spring.datasource.username=postgres
spring.datasource.password=1b2b3b4b1b2b3b4B # <-- BURAYI KENDİ BELİRLEDİĞİNİZ ŞİFREYLE GÜNCELLEYİN!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate) Ayarları
# 'update' geliştirme için idealdir: tabloları yoksa oluşturur, varsa entity değişikliklerine göre günceller.
# Üretim ortamında genellikle 'none' veya migration araçları kullanılır.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true # Gösterilen SQL sorgularını daha okunur formatta gösterir
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect # Hibernate'e PostgreSQL kullandığınızı bildirir


